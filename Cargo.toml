[package]
name = "Bolume"
# 版本号按 0.01 一档往上走：0.41 → 0.49 → 0.50（不是 0.4.10）。
# Cargo 必须写三段，界面上显示时去掉末尾的 .0（见 `main::version`）。
version = "0.88.0"
edition = "2024"
description = "Next-generation Windows audio mixer"

[features]
default = ["gui"]
# 界面层：GPUI（自绘，不带组件库）。音频层与界面层解耦，可用 --no-default-features 单独验证音频。
gui = ["dep:gpui", "dep:gpui_platform", "dep:tray-icon", "dep:gpui_ce_windows"]

[dependencies]
gpui = { package = "gpui-ce", version = "0.2.2", optional = true }
gpui_platform = { package = "gpui_ce_platform", version = "0.1.0", optional = true }
tray-icon = { version = "=0.24.1", optional = true }
# 只为了 `trim_graphics()`：空闲时让 D3D 驱动把缓存的提交还回去（见 memory.rs）。
gpui_ce_windows = { version = "0.1.0", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "6"
async-channel = "2"
ddc = "0.2.2"
ddc-winapi = "0.2.2"

# 本地打过补丁的 Windows 平台层：vsync 线程跳过隐藏窗口，否则托盘常驻时空烧
# 约 80% 单核 CPU（详见 vendor/gpui_ce_windows/src/platform.rs 里的 Bolume patch）。
# 升级 gpui-ce 时要把 patch 重新打到新版 gpui_ce_windows 上。
# 本地打过补丁的 gpui 本体：屏幕提示的元素要能各自旋转，而 gpui 只给 svg 做了
# 变换矩阵。详见 vendor/gpui-ce/src/window.rs 里的「Bolume patch」注释。
[patch.crates-io]
gpui_ce_windows = { path = "vendor/gpui_ce_windows" }
gpui-ce = { path = "vendor/gpui-ce" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Media_Control",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Devices_Radios",
    "Win32_Devices_Display",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62.2"
windows-collections = "0.3.2"
windows-future = "0.3.2"
raw-window-handle = "0.6"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# 体积优先：单文件分发、常驻托盘，不要为了让跑分好看多塞几 MB 代码。
# `opt-level = "z"` 比 "s" 再小 1.4MB（10.8 → 9.4）；绘制量很小，
# 内联少一点感知不到；
# fat LTO + 单 codegen unit 让跨 crate 的死代码真正被删掉。
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# 本地 crate 里跑的是音频 DSP（响度均衡逐样本）和界面场景构建，留在 "s"
# （跟以前一样，音质/延迟验证过）；"z" 只套在依赖上 —— 体积大头是 gpui、
# resvg、windows 这些，单给它们降到 "z" 就能省下 mb 级，DSP 不受影响。
[profile.release.package.Bolume]
opt-level = "s"
